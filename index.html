<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Framework Calculator</title>
  <link rel="icon" href="./logo.png" type="image/png">

<body style=background-color:#707070>
  <h2>Framework Calculator (for BABFT)</h2>

  <label>Explained in: <a href="https://www.youtube.com/">Not uploaded yet...</a></label>
  <br><br>

  <label>Horizontal distance (x): <input id="x" type="number" step="any" value="10"></label><br>
  <label>Horizontal distance (y): <input id="y" type="number" step="any" value="4"></label><br>
  <label>Vertical distance (z): <input id="z" type="number" step="any" value="6"></label><br>
  
  <label>Type:
    <select id="type">
      <option value="beam">Beam (rectangular)</option>
      <option value="pipe">Pipe (circular)</option>
    </select>
  </label><br>

  <label id="diam" style="display:none;">Pipe diameter: <input id="d" type="number" step="any" value="2"></label>
  <br id="b0" style="display:none;">
  <label id="degr" style="display:none;">Degrees for rotating (smaller number = smoother): <input id="deg" type="number" step="any" value="15"></label>
  <br id="b1" style="display:none;">
  <br>

  <button id="calc">Calculate</button>

  <pre id="output">(click calculate)</pre>

  <br><pre style="font-size: 9px;">v1.0.0 (YouTube: @dabl2829)</pre>

  <script>
    //framework calculator (by @dabl2928 on youtube)
    //v1.0.0 - initial (2026 Jun 8)
    //v1.0.1 - remove split degrees because update fixed the rotate glitch (2026 Jul 6)

    function round(n,d=2) {
      p=Math.pow(10,d)
      return Math.round(n*p)/p
    } //default rounds to 2 decimals

    function io(id) {
      return document.getElementById(id);
    } //input output

    function nearint(x,e=1e-9) {
      return Math.abs(Math.round(x)-x)<e
    } //allows numbers like 2.000000000004 or 1.999999999999998 or whatever (computer math bug because its binary)

    function framework() {
      type=io('type').value
      x=Math.abs(parseFloat(io('x').value))
      y=Math.abs(parseFloat(io('y').value))
      z=Math.abs(parseFloat(io('z').value))
      d=parseFloat(io('d').value) //pipe diameter
      deg=parseFloat(io('deg').value) //degrees for rotating
      
      if (type=='beam') {d=1;deg=15}

      valid=(d>0.05 && nearint(360/deg/2))

      if (valid) {
        alpha0=round(Math.atan(x/y)*180/Math.PI) //from top down angle
        alpha1=round(90-alpha0)
        alpha=Math.min(alpha0,alpha1)
        beta=round(Math.atan(z/Math.sqrt(x*x + y*y))*180/Math.PI) //angle from floor up
        length=round(Math.sqrt(x*x + y*y + z*z))

        if (type=='beam') {
          out=`=========BEAM=========\n`
        } else {
          n=360/deg
          circle_piece=round(d*Math.tan(Math.PI/n)/2)*2
          out=`=========PIPE=========\n`
        }
        out+=`X: ${round(x)}\n`
        out+=`Y: ${round(y)}\n`
        out+=`Z: ${round(z)}\n\n`

        out+=`Length: ${length} (use ${length}, both sides)\n\n`

        out+=`Top down angle: ${alpha}\n`
        out+=`Vertical angle: ${beta}`

        if (type=='pipe') {
            out+=`\n\nPipe diameter: ${d} (amount in scale: ${round(d/2-1)} both sides)\n`
            out+=`Circle piece: ${circle_piece} (amount in scale: ${round(circle_piece/2-1)})\n`
            out+=`Degrees for rotating: ${round(deg)}`
        }

      } else {
        if (d<0.05) {
            out=`ERROR: Pipe diameter is too small (entered ${d})`
        } else if (!nearint(360/deg/2)) {
          out=`ERROR: Invalid degrees for rotating (you don't get a full number of pieces or it's not a multiple of 2: ${round(360/deg)})\n\n`
          out+=`List of degrees that would work (choose any):\n`
          for (tn=8;tn<7200;tn+=4) { //checks up to 7200 scenarios for correct degrees for rotating
          td=360/tn;nicenumber=(round(td,2)==td);if(isNearlyInteger(tn/4) && nicenumber){out+=` -degrees: ${360/tn}\n`}}
        }
      }
      io('output').textContent=out
      io('output').style.fontSize='16px'
      io('output').style.fontWeight='normal'
    }

      io('output').textContent=a
      io('output').style.fontSize='4px'
      io('output').style.fontWeight='bold'
    }

    io("calc").onclick=framework

    io('type').onchange=e=>{
      if (e.target.value === 'pipe') {
        io('diam').style.display=''
        io('b0').style.display=''
        io('degr').style.display=''
        io('b1').style.display=''
        ASCIIframe()
      } else {
        io('diam').style.display='none'
        io('b0').style.display='none'
        io('degr').style.display='none'
        io('b1').style.display='none'
        ASCIIframe()
      }
    }

    ASCIIframe()
